      /* Advanced Reveal Logic */
      .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
      .reveal.active { opacity: 1; transform: translateY(0); }
      
      .reveal-zoom { opacity: 0; transform: scale(0.8) translateY(20px); transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }

      .reveal-left { opacity: 0; transform: translateX(-50px); transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1); }

  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      const observeReveals = () => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });

        document.querySelectorAll('[class*="reveal"]:not(.active)').forEach(el => observer.observe(el));
      };

      window.initReveals = observeReveals;
      setInterval(observeReveals, 1000);
    </script>
  </body>
