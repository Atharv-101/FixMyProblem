
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FixMyProblem | Powered by ATHinnovations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              coral: '#FF5F5F',
              forest: '#064E3B',
              citrus: '#FDE047',
              paper: '#FDFDFD',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pop': 'pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
              'scan': 'scan 3s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                '50%': { transform: 'translateY(-10px) rotate(0.5deg)' },
              },
              pop: {
                '0%': { transform: 'scale(0.9) translateY(10px)', opacity: '0' },
                '100%': { transform: 'scale(1) translateY(0)', opacity: '1' },
              },
              scan: {
                '0%': { top: '-10%' },
                '100%': { top: '110%' }
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --brutalist-border: 2px solid #000;
        --brutalist-shadow: 4px 4px 0px 0px #000;
      }
      @media (min-width: 768px) {
        :root {
          --brutalist-border: 3px solid #000;
          --brutalist-shadow: 8px 8px 0px 0px #000;
        }
      }
      
      /* Reset & Global Theme */
      html { scroll-behavior: smooth; }
      body {
        background-color: #FDFDFD;
        background-image: 
          linear-gradient(#f3f4f6 1px, transparent 1px),
          linear-gradient(90deg, #f3f4f6 1px, transparent 1px);
        background-size: 30px 30px;
        color: #000;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      
      /* MAGIC EMOJI CURSOR - PERFORMANCE OPTIMIZED */
      #magic-cursor {
        position: fixed;
        top: 0;
        left: 0;
        font-size: 32px;
        pointer-events: none;
        z-index: 99999;
        will-change: transform;
        transform: translate3d(-50%, -50%, 0);
        display: none; 
        align-items: center;
        justify-content: center;
        user-select: none;
        line-height: 1;
      }
      body.landing-active { cursor: none; }
      body.landing-active a, body.landing-active button, body.landing-active .tactile-card { cursor: none; }
      body.landing-active #magic-cursor { display: flex; }
      @media (pointer: coarse) { body.landing-active #magic-cursor { display: none !important; } }

      /* Tactile Brutalist Components */
      .tactile-card {
        border: var(--brutalist-border);
        box-shadow: var(--brutalist-shadow);
        background: #fff;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      }
      .tactile-card:hover {
        transform: translate(-2px, -2px);
        box-shadow: 10px 10px 0px 0px #000;
      }
      .tactile-btn {
        border: var(--brutalist-border);
        box-shadow: 4px 4px 0px 0px #000;
        transition: all 0.1s ease;
      }
      .tactile-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px 0px #000;
      }
      
      .marker-highlight { position: relative; z-index: 1; display: inline-block; }
      .marker-highlight::after {
        content: '';
        position: absolute;
        left: -1%;
        bottom: 12%;
        width: 0;
        height: 35%;
        background: #FDE047;
        z-index: -1;
        transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        transform: skewX(-10deg);
      }
      .reveal .marker-highlight::after { width: 102%; }
      
      .reveal { animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
      
      .sticker-tape {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%) rotate(-2deg);
        width: 80px;
        height: 24px;
        background: rgba(253, 224, 71, 0.8);
        backdrop-filter: blur(2px);
        border: 1px solid rgba(0,0,0,0.1);
        z-index: 10;
        pointer-events: none;
      }

      /* Responsiveness Tweaks */
      section { padding-top: 3rem; padding-bottom: 3rem; }
      @media (min-width: 1024px) {
        section { padding-top: 5rem; padding-bottom: 5rem; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0",
    "three": "https://esm.sh/three@^0.182.0"
  }
}
</script>
</head>
  <body class="selection:bg-citrus selection:text-black">
    <div id="magic-cursor">👀</div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      const cursor = document.getElementById('magic-cursor');
      let targetX = 0, targetY = 0;
      let currentX = 0, currentY = 0;

      window.addEventListener('mousemove', (e) => {
        targetX = e.clientX;
        targetY = e.clientY;
      });

      function updateCursor() {
        const lerp = 0.25; // Snappier response
        currentX += (targetX - currentX) * lerp;
        currentY += (targetY - currentY) * lerp;
        cursor.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        requestAnimationFrame(updateCursor);
      }
      updateCursor();

      window.addEventListener('mousedown', () => {
        if(!document.body.classList.contains('landing-active')) return;
        cursor.innerText = '😁';
        cursor.style.scale = '1';
      });
      
      window.addEventListener('mouseup', () => {
        if(!document.body.classList.contains('landing-active')) return;
        cursor.innerText = '👀';
        cursor.style.scale = '1';
      });

      window.addEventListener('mouseover', (e) => {
        if(!document.body.classList.contains('landing-active')) return;
        if (e.target.closest('button, a, .tactile-card')) {
          cursor.innerText = '🪄';
        } else {
          cursor.innerText = '👀';
        }
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('reveal');
        });
      }, { threshold: 0.1 });

      window.addEventListener('load', () => {
        document.querySelectorAll('section, h1, h2, .tactile-card, .stagger-entry').forEach(el => observer.observe(el));
      });
    </script>
  </body>
</html>
