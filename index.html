<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixMyProblem - Innovate, Solve, Elevate: Your Tech Challenge Platform</title>
    <meta name="description" content="FixMyProblem is a collaborative platform connecting companies with real-world technical challenges to talented college students. Accelerate innovation, build skills, and earn rewards. Discover our mission, services, impact stories, and more."/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                900: '#1e3a8a',
              },
              secondary: {
                500: '#64748b',
                900: '#0f172a',
              }
            },
            keyframes: {
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'pop-in': {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              'slide-in-right': {
                '0%': { opacity: '0', transform: 'translateX(10px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              'pulse-slow': {
                '0%, 100%': { opacity: '.1' },
                '50%': { opacity: '.2' },
              },
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'fade-out': {
                '0%': { opacity: '1' },
                '100%': { opacity: '0' },
              }
            },
            animation: {
              'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
              'fade-in-up-100': 'fade-in-up 0.5s ease-out 0.1s forwards',
              'fade-in-up-200': 'fade-in-up 0.5s ease-out 0.2s forwards',
              'fade-in-up-300': 'fade-in-up 0.5s ease-out 0.3s forwards',
              'fade-in-up-400': 'fade-in-up 0.5s ease-out 0.4s forwards',
              'fade-in-up-500': 'fade-in-up 0.5s ease-out 0.5s forwards',
              'pop-in': 'pop-in 0.4s ease-out forwards',
              'pop-in-200': 'pop-in 0.4s ease-out 0.2s forwards',
              'slide-in-right': 'slide-in-right 0.5s ease-out forwards',
              'pulse-slow': 'pulse-slow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fade-in 0.3s ease-out forwards',
              'fade-out': 'fade-out 0.3s ease-out forwards',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://esm.sh/lucide-react@0.363.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js",
    "firebase/storage": "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
    "three": "https://aistudiocdn.com/three@^0.181.2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <link rel="stylesheet" href="./style.css"> 
  </body>
</html>
